<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Code with Jallow, Basse, The Gambia</title>
  <meta name="description" content="Contact Code with Jallow (JTECH Academy) in Basse, Upper River Region, The Gambia. Call or WhatsApp 866878690 / 835008845 or send us a message.">
  <meta name="theme-color" content="#0a1b36">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" style="background:rgba(255,255,255,.1);color:var(--sun)">Contact us</span>
        <h1>Let's talk.</h1>
        <p>Questions about courses, fees or schedules? Call, WhatsApp, or send us a message.</p>
      </div>
    </section>

    <section class="section" style="padding-top:48px">
      <div class="container form-wrap">
        <div class="form-card">
          <h2 style="font-size:1.6rem">Send us a message</h2>
          <div class="form-error" role="alert"></div>
          <form id="contact-form" novalidate>
            <div class="form-grid">
              <div class="field"><label for="name">Your name</label><input id="name" name="name" required autocomplete="name"></div>
              <div class="field"><label for="phone">Phone / WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
              <div class="field full"><label for="email">Email <span class="opt">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email"></div>
              <div class="field full"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
              <div class="hp" aria-hidden="true"><label>Leave empty <input name="website" tabindex="-1" autocomplete="off"></label></div>
              <div class="field full"><button class="btn btn-primary" type="submit">Send message</button></div>
            </div>
          </form>
          <div class="success" role="status">
            <div class="tick" data-icon="check"></div>
            <h2>Thanks, <span data-name></span>!</h2>
            <p class="lead">Your message has been sent. We will get back to you soon.</p>
          </div>
        </div>

        <aside>
          <ul class="contact-list">
            <li><span class="icon-box" data-icon="phone"></span><div><strong>Phone / WhatsApp</strong><span data-phone-list></span></div></li>
            <li><span class="icon-box" data-icon="pin"></span><div><strong>Location</strong><span data-location></span></div></li>
          </ul>
          <p style="margin-top:26px"><a class="btn btn-sun" data-wa="Hello! I have a question about Code with Jallow." href="#" target="_blank" rel="noopener">Chat on WhatsApp</a></p>
          <h3 style="margin-top:30px;font-size:1.05rem">Follow us</h3>
          <div class="socials" data-socials></div>
        </aside>
      </div>
      <div class="container" style="margin-top:40px">
        <iframe class="map" title="Map of Basse, The Gambia" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Basse+Santa+Su,+The+Gambia&output=embed"></iframe>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

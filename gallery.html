<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo & Video Gallery | Code with Jallow</title>
  <meta name="description" content="Photos and videos of classes, workshops, student projects and community activities at Code with Jallow in Basse, The Gambia.">
  <meta name="theme-color" content="#040913">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-hero grid-bg"><div class="orb a"></div>
      <div class="container">
        <span class="eyebrow">Gallery</span>
        <h1>Our classes, our community.</h1>
        <p>Moments from classes, workshops, student projects and community activities.</p>
      </div>
    </section>
    <section class="section" style="padding-top:48px">
      <div class="container">
        <div class="filters" id="gallery-filters" role="group" aria-label="Filter gallery"></div>
        <div class="gallery" data-render="gallery"></div>
      </div>
    </section>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer"><button aria-label="Close">×</button><div><img alt=""><p></p></div></div>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fx.js"></script>
</body>
</html>
